name: Saludo usando variables
run-name: Saludo usando variables
on:
  push:

env:
  DIA_DE_LA_SEMANA: Lunes 

jobs:
  Saludo_variables:
    runs-on: ubuntu-latest
    env:
      SALUDO: Hola
      NOMBRE: ${{ github.actor }}
    steps:
    - name: Echo de saludo y nombre
      run: echo "${{ env.SALUDO }} ${{ env.NOMBRE }}, hoy es $DIA_DE_LA_SEMANA"
